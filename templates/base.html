<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PasajeYA{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <nav class="menu">
    <a class="marca" href="{{ url_for('home') }}">Pasaje<span>YA</span></a>
    <div class="enlaces">
      <a href="{{ url_for('home') }}" class="{{ 'activo' if request.endpoint == 'home' }}">Buscar viaje</a>
      {% if session.get('admin_id') %}
        <a href="{{ url_for('admin') }}" class="{{ 'activo' if request.endpoint == 'admin' }}">Panel admin</a>
        <form method="POST" action="{{ url_for('logout') }}">
          <button type="submit" class="btn peligro chico">Cerrar sesión ({{ session.get('admin_nombre') }})</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}" class="{{ 'activo' if request.endpoint == 'login' }}">Acceso administrador</a>
      {% endif %}
    </div>
  </nav>

  {% for m in get_flashed_messages() %}
    <div class="mensaje">{{ m }}</div>
  {% endfor %}

  <main class="pagina {% block ancho %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
