{% extends "base.html" %}
{% block title %}Login administrador{% endblock %}
{% block content %}
<div class="login">
    <h2>Bienvenido a PasajeYA</h2>
    <p>Inicia sesión como administrador para continuar</p>

    <form method="post" action="{{ url_for('login') }}">
        <label for="txtcorreo">Correo</label>
        <input type="email" name="txtcorreo" id="txtcorreo" required>

        <label for="txtClave">Contraseña</label>
        <input type="password" name="txtClave" id="txtClave" required>

        <button type="submit">Ingresar</button>
        <button type="reset">Cancelar</button>
    </form>

    <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
</div>
{% endblock %}
