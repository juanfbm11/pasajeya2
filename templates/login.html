{% extends "base.html" %}
{% block title %}Login administrador{% endblock %}
{% block ancho %}angosta{% endblock %}

{% block content %}
<section class="tarjeta">
  <h1>Bienvenido a PasajeYA</h1>
  <p class="subtitulo">Inicia sesión como administrador para continuar.</p>

  <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
    <label for="txtcorreo">Correo</label>
    <input type="email" id="txtcorreo" name="txtcorreo" required autocomplete="username">

    <label for="txtClave">Contraseña</label>
    <input type="password" id="txtClave" name="txtClave" required autocomplete="current-password">

    <div class="acciones">
      <button type="submit" class="btn">Ingresar</button>
      <a class="btn secundario" href="{{ url_for('home') }}">Cancelar</a>
    </div>
  </form>
  <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
</section>
{% endblock %}
