

{% extends "base.html" %}

{% block title %}Registro administrador{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

<main class="login">
  <h1>Registro de administrador</h1>

  <form method="POST" action="{{ url_for('registro') }}">
    <label for="txtNombre">Nombre</label>
    <input type="text" id="txtNombre" name="txtNombre" required>

    <label for="txtcorreo">Correo</label>
    <input type="email" id="txtcorreo" name="txtcorreo" required autocomplete="username">

    <label for="txtClave">Contraseña (mínimo 8 caracteres)</label>
    <input type="password" id="txtClave" name="txtClave" minlength="8" required autocomplete="new-password">

    <label for="txtCodigo">Código de autorización</label>
    <input type="password" id="txtCodigo" name="txtCodigo" required>

    <button type="submit">Crear cuenta</button>
  </form>

  <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</main>
{% endblock %}
